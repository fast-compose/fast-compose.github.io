<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Jetpack Compose Online - Fast Compose</title>
    <meta name="description"
          content="Write Jetpack Compose code and run it in your browser. No Android Studio, no Gradle, no build. Share your code as a link, or see the HTML to put it in any web page.">
    <meta name="keywords"
          content="run Jetpack Compose online, Jetpack Compose online editor, Compose playground, try Compose, compose-script, Kotlin UI online">
    <link rel="canonical" href="https://fast-compose.github.io/try/">
    <meta name="theme-color" content="#0B1020">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Fast Compose">
    <meta property="og:title" content="Run Jetpack Compose Online">
    <meta property="og:description" content="Write Jetpack Compose and run it in your browser. No build.">
    <meta property="og:url" content="https://fast-compose.github.io/try/">
    <meta property="og:image" content="https://fast-compose.github.io/logo.png">
    <meta name="twitter:card" content="summary">

    <link rel="icon" type="image/png" href="../playground/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="../logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../learn/learn.css">
    <style>
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; overflow: hidden; }

        .bar {
            display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
            padding: 10px 16px; border-bottom: 1px solid var(--outline); background: var(--surface);
        }
        .bar .brand { font-size: 15px; }
        .bar .brand img { width: 26px; height: 26px; }
        .bar .spacer { flex: 1; }
        .run-btn {
            display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
            background: var(--primary); color: var(--on-primary); border: 0; border-radius: 10px;
            font: 700 15px var(--sans); padding: 8px 18px;
        }
        .run-btn:hover { filter: brightness(1.08); }
        .bar .keys { font-size: 13px; color: var(--muted); }
        .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); cursor: pointer; user-select: none; }
        .toggle input { accent-color: var(--primary); width: 16px; height: 16px; margin: 0; cursor: pointer; }
        .toggle:hover { color: var(--text); }
        .bar a.link { font-size: 14px; color: var(--muted); }
        .bar a.link:hover { color: var(--text); }

        /* --split is the code pane's share: of the width side by side, of the height when stacked */
        .panes {
            --split: 50%;
            flex: 1; display: grid; min-height: 0;
            grid-template-columns: minmax(0, var(--split)) 8px minmax(0, 1fr);
        }
        .pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }

        .gutter {
            position: relative; background: var(--surface); cursor: col-resize; touch-action: none;
            border-left: 1px solid var(--outline); border-right: 1px solid var(--outline);
        }
        .gutter::after {
            content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
            width: 2px; height: 32px; border-radius: 2px; background: var(--outline);
        }
        .gutter:hover::after, .gutter:focus-visible::after, body.dragging .gutter::after { background: var(--primary); }
        .gutter:focus-visible { outline: none; }
        /* the iframe would take the pointer while dragging over it */
        body.dragging #result { pointer-events: none; }
        body.dragging { cursor: col-resize; user-select: none; }
        .pane-label {
            padding: 8px 16px; font-size: 12px; font-weight: 600; color: var(--muted);
            letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--outline);
        }
        #editor {
            flex: 1; width: 100%; resize: none; border: 0; outline: none; margin: 0;
            padding: 16px 18px; background: var(--code-bg); color: var(--tok-plain);
            font: 14px/1.65 var(--mono); tab-size: 4; white-space: pre; overflow: auto;
        }
        #result { flex: 1; width: 100%; border: 0; background: #FFFFFF; }

        @media (max-width: 760px) {
            .panes { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, var(--split)) 8px minmax(0, 1fr); }
            .gutter {
                cursor: row-resize; border: 0;
                border-top: 1px solid var(--outline); border-bottom: 1px solid var(--outline);
            }
            .gutter::after { width: 32px; height: 2px; }
            body.dragging { cursor: row-resize; }
            .bar .keys { display: none; }
        }
    </style>
</head>
<body>

<div class="bar">
    <a class="brand" href="../"><img src="../logo.png" alt="">Fast Compose</a>
    <button class="run-btn" id="run" type="button">Run &#9654;</button>
    <span class="keys">or Ctrl + Enter</span>
    <label class="toggle"><input type="checkbox" id="show-html"> Show HTML</label>
    <span class="spacer"></span>
    <a class="link" id="playground" target="_blank" rel="noopener">Open in Playground</a>
    <a class="link" href="../learn/">Lessons</a>
</div>

<div class="panes">
    <div class="pane">
        <div class="pane-label" id="editor-label">Compose</div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code"></textarea>
    </div>
    <div class="gutter" id="gutter" role="separator" tabindex="0" aria-label="Resize the code and result panes"
         aria-valuemin="15" aria-valuemax="85" aria-valuenow="50" title="Drag to resize, double click to reset"></div>
    <div class="pane">
        <div class="pane-label">Result</div>
        <iframe id="result" title="Result"></iframe>
    </div>
</div>

<script>
    // Runs Compose code with compose-script. The code is the body of a composable; with "Show HTML" it is the whole
    // page that holds it. The page address keeps it as #code=… or #html=… (URL-safe Base64, without padding).
    // Each run writes a new document into the iframe, since compose-script reads its tags once, at start.
    (function () {
        var COMPOSE_SCRIPT = "https://cdn.jsdelivr.net/npm/@fast-compose/compose-script@0.2.0/compose-script.js";
        var DEFAULT_CODE = [
            "var count by remember { mutableStateOf(0) }",
            "",
            "Column(Modifier.padding(16.dp), horizontalAlignment = Alignment.CenterHorizontally) {",
            "    Text(\"Clicked $count times\", fontSize = 20.sp)",
            "    Spacer(Modifier.height(8.dp))",
            "    Button(onClick = { count++ }) {",
            "        Text(\"Click me\")",
            "    }",
            "}"
        ].join("\n");

        var editor = document.getElementById("editor");
        var editorLabel = document.getElementById("editor-label");
        var showHtml = document.getElementById("show-html");
        var result = document.getElementById("result");
        var playground = document.getElementById("playground");

        // The last Compose code, kept for when the HTML has no Compose script to read it back from.
        var lastCode = DEFAULT_CODE;

        function encode(text) {
            var bytes = new TextEncoder().encode(text), binary = "";
            bytes.forEach(function (b) { binary += String.fromCharCode(b); });
            return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }

        function decode(value) {
            try {
                var base64 = value.replace(/-/g, "+").replace(/_/g, "/");
                var binary = atob(base64 + "===".slice((base64.length + 3) % 4));
                return new TextDecoder().decode(Uint8Array.from(binary, function (c) { return c.charCodeAt(0); }));
            } catch (e) {
                return null;
            }
        }

        function hashValue(key) {
            var match = location.hash.match(new RegExp("[#&]" + key + "=([^&]*)"));
            return match ? decode(match[1]) : null;
        }

        function indent(text, spaces) {
            var pad = new Array(spaces + 1).join(" ");
            return text.split("\n").map(function (l) { return l ? pad + l : l; }).join("\n");
        }

        // Removes the indentation shared by every line, and blank lines at both ends.
        function dedent(text) {
            var lines = text.replace(/\t/g, "    ").split("\n");
            while (lines.length && !lines[0].trim()) lines.shift();
            while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
            if (!lines.length) return "";
            var shared = Math.min.apply(null, lines.filter(function (l) { return l.trim(); })
                .map(function (l) { return l.match(/^ */)[0].length; }));
            return lines.map(function (l) { return l.slice(shared); }).join("\n");
        }

        // A whole page that renders the code with compose-script.
        function asHtml(code) {
            var safe = code.replace(/<\/script/gi, "<\\/script");
            return [
                "<!DOCTYPE html>",
                "<html>",
                "<head>",
                '    <script src="' + COMPOSE_SCRIPT + '"><\/script>',
                "</head>",
                "<body>",
                "",
                '<script type="text/compose-content">',
                indent(safe, 4),
                "<\/script>",
                "",
                "</body>",
                "</html>"
            ].join("\n");
        }

        // The Compose code of the first content script in [html], or null when there is none.
        function codeFromHtml(html) {
            var match = html.match(/<script[^>]*type=["']text\/compose-content["'][^>]*>([\s\S]*?)<\/script>/i);
            return match ? dedent(match[1]) : null;
        }

        // The code as a whole file with a @Preview function, for the playground.
        function asPreviewFile(body) {
            return "@Preview(showBackground = true)\n@Composable\nfun Example() {\n" + indent(body, 4) + "\n}\n";
        }

        function currentCode() {
            if (!showHtml.checked) return editor.value;
            return codeFromHtml(editor.value) || lastCode;
        }

        function run() {
            var html = showHtml.checked ? editor.value : asHtml(editor.value);
            result.srcdoc = html.replace("</head>", "<style>body { margin: 16px; background: #FFFFFF; }</style></head>");
            lastCode = currentCode();
            history.replaceState(null, "", (showHtml.checked ? "#html=" : "#code=") + encode(editor.value));
            playground.href = "../playground/#theme=vs-code-light&font=14&mode=split&split=50&code=" +
                encode(asPreviewFile(lastCode));
        }

        function setMode(html) {
            editorLabel.textContent = html ? "HTML" : "Compose";
            editor.setAttribute("aria-label", html ? "HTML code" : "Compose code");
        }

        showHtml.addEventListener("change", function () {
            if (showHtml.checked) {
                lastCode = editor.value;
                editor.value = asHtml(editor.value);
            } else {
                editor.value = codeFromHtml(editor.value) || lastCode;
            }
            setMode(showHtml.checked);
            run();
        });

        editor.addEventListener("keydown", function (event) {
            if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
                event.preventDefault();
                run();
            } else if (event.key === "Tab" && !event.shiftKey) {
                // Tab indents instead of leaving the editor.
                event.preventDefault();
                document.execCommand("insertText", false, "    ");
            }
        });
        document.getElementById("run").addEventListener("click", run);

        // ---------- resizing the panes ----------

        var panes = document.querySelector(".panes");
        var gutter = document.getElementById("gutter");
        var stacked = window.matchMedia("(max-width: 760px)");
        var SPLIT_KEY = "try-split";
        var MIN = 15, MAX = 85, DEFAULT_SPLIT = 50;

        function setSplit(percent, save) {
            var value = Math.round(Math.min(MAX, Math.max(MIN, percent)));
            panes.style.setProperty("--split", value + "%");
            gutter.setAttribute("aria-valuenow", String(value));
            if (save) {
                try { localStorage.setItem(SPLIT_KEY, String(value)); } catch (e) { /* storage blocked */ }
            }
            return value;
        }

        function savedSplit() {
            try {
                var value = parseFloat(localStorage.getItem(SPLIT_KEY));
                return isNaN(value) ? DEFAULT_SPLIT : value;
            } catch (e) {
                return DEFAULT_SPLIT;
            }
        }

        // The pointer's position as a share of the panes: of the width side by side, of the height when stacked.
        function percentAt(event) {
            var box = panes.getBoundingClientRect();
            return stacked.matches
                ? (event.clientY - box.top) / box.height * 100
                : (event.clientX - box.left) / box.width * 100;
        }

        gutter.addEventListener("pointerdown", function (event) {
            event.preventDefault();
            gutter.setPointerCapture(event.pointerId);
            document.body.classList.add("dragging");
        });
        gutter.addEventListener("pointermove", function (event) {
            if (gutter.hasPointerCapture(event.pointerId)) setSplit(percentAt(event), false);
        });
        function endDrag(event) {
            if (!gutter.hasPointerCapture(event.pointerId)) return;
            gutter.releasePointerCapture(event.pointerId);
            document.body.classList.remove("dragging");
            setSplit(percentAt(event), true);
        }
        gutter.addEventListener("pointerup", endDrag);
        gutter.addEventListener("pointercancel", endDrag);
        gutter.addEventListener("dblclick", function () { setSplit(DEFAULT_SPLIT, true); });
        gutter.addEventListener("keydown", function (event) {
            var step = event.shiftKey ? 10 : 2;
            var current = parseFloat(gutter.getAttribute("aria-valuenow"));
            var back = stacked.matches ? "ArrowUp" : "ArrowLeft";
            var forward = stacked.matches ? "ArrowDown" : "ArrowRight";
            if (event.key === back) setSplit(current - step, true);
            else if (event.key === forward) setSplit(current + step, true);
            else if (event.key === "Home") setSplit(MIN, true);
            else if (event.key === "End") setSplit(MAX, true);
            else return;
            event.preventDefault();
        });

        function setOrientation() {
            gutter.setAttribute("aria-orientation", stacked.matches ? "horizontal" : "vertical");
        }
        stacked.addEventListener("change", setOrientation);
        setOrientation();
        setSplit(savedSplit(), false);

        // ---------- start ----------

        var html = hashValue("html");
        if (html !== null) {
            showHtml.checked = true;
            editor.value = html;
        } else {
            showHtml.checked = false;
            editor.value = hashValue("code") || DEFAULT_CODE;
        }
        setMode(showHtml.checked);
        run();
    })();
</script>
</body>
</html>
