<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Compose - An instant runtime for Jetpack Compose code</title>
    <meta name="description"
          content="Fast Compose runs Jetpack Compose code without a compiler or a build. Use it in the browser playground, in static web pages with compose-script, in Android Studio, IntelliJ IDEA and VS Code, and from the terminal.">
    <meta name="keywords"
          content="Jetpack Compose, Compose Multiplatform, Kotlin, live preview, @Preview, Compose online, compose-script, Android Studio plugin, VS Code extension, Fast Compose">
    <link rel="canonical" href="https://fast-compose.github.io/">
    <meta name="theme-color" content="#0B1020">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Fast Compose">
    <meta property="og:title" content="Fast Compose - Jetpack Compose with no compiler and no build">
    <meta property="og:description"
          content="Write Compose code, see it render in milliseconds, on Android, iOS, desktop and the web.">
    <meta property="og:url" content="https://fast-compose.github.io/">
    <meta property="og:image" content="https://fast-compose.github.io/logo.png">
    <meta name="twitter:card" content="summary">

    <link rel="icon" type="image/png" href="playground/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- compose-script: the whole page below is one Compose app in a <script type="text/compose-content"> tag -->
    <script src="https://cdn.jsdelivr.net/npm/@fast-compose/compose-script@0.2.0/compose-script.js"></script>

    <style>
        html, body { margin: 0; height: 100%; background: #0B1020; overflow: hidden; }
        compose-content { display: block; }
        compose-content[data-loading] { background: #0B1020; animation: none; }

        /* full-screen loader, hidden once compose-script starts the page */
        #loader {
            position: fixed; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
            background: #0B1020;
            transition: opacity .3s, visibility .3s;
        }
        #loader img { width: 112px; height: 112px; }
        #loader .spinner {
            width: 36px; height: 36px; border-radius: 50%;
            border: 3px solid #222B4A; border-top-color: #3DDC84;
            animation: spin .9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        body:has(compose-content:not([data-loading])) #loader { opacity: 0; visibility: hidden; }
        noscript { display: block; padding: 24px; color: #E6E9F5; font-family: system-ui, sans-serif; }
        noscript a { color: #3DDC84; }
    </style>
</head>
<body>

<div id="loader">
    <img src="logo.png" alt="Fast Compose">
    <div class="spinner"></div>
</div>

<noscript>
    <h1>Fast Compose</h1>
    <p>An instant runtime for Jetpack Compose code. No compiler, no build, no waiting. This page is built with
        compose-script and needs JavaScript and WebAssembly.</p>
    <ul>
        <li><a href="playground/">Playground</a>: run Jetpack Compose online.</li>
        <li><a href="https://github.com/fast-compose/compose-script">Compose Script</a>: live Compose inside any web page.</li>
        <li><a href="https://plugins.jetbrains.com/plugin/35776-fast-compose-preview">IDE Plugin</a>: instant previews in Android Studio and IntelliJ IDEA.</li>
        <li><a href="https://marketplace.visualstudio.com/items?itemName=fast-compose.fast-compose-preview">VS Code Extension</a>: instant previews in VS Code.</li>
        <li><a href="https://github.com/fast-compose/fast-compose/blob/main/docs/LIBRARY.md">KMP Library</a>: render Compose code at runtime in your Kotlin Multiplatform apps.</li>
        <li><a href="https://github.com/fast-compose/compose-cli">CLI and MCP</a>: check and render previews from the terminal and AI agents.</li>
    </ul>
</noscript>

<script type="text/compose-content" data-composable="Home" style="width: 100%; height: 100vh">
    // ---------- theme ----------

    // Code highlighting, outside the Material theme
    val Tag = Color(0xFF7DD3FC)
    val Attr = Color(0xFFA5B4FC)
    val Str = Color(0xFF3DDC84)
    val Kw = Color(0xFFF0ABFC)
    val Fn = Color(0xFFFDE68A)
    val Plain = Color(0xFFC9D1EE)
    val Comment = Color(0xFF64748B)

    // Badge color for work in progress
    val Amber = Color(0xFFFBBF24)

    val SITE = "https://fast-compose.github.io/"

    @Composable
    fun AppTheme(content: @Composable () -> Unit) {
        val colors = darkColorScheme(
            primary = Color(0xFF3DDC84),
            onPrimary = Color(0xFF04121F),
            secondary = Color(0xFF3B82F6),
            onSecondary = Color.White,
            tertiary = Color(0xFF5B4BD6),
            onTertiary = Color.White,
            background = Color(0xFF0B1020),
            onBackground = Color(0xFFE6E9F5),
            surface = Color(0xFF111832),
            onSurface = Color(0xFFE6E9F5),
            onSurfaceVariant = Color(0xFF98A2C3),
            surfaceContainerLowest = Color(0xFF070B17),
            outline = Color(0xFF222B4A),
            outlineVariant = Color(0xFF64748B),
            error = Color(0xFFF87171)
        )
        MaterialTheme(colorScheme = colors) { content() }
    }

    data class Step(val title: String, val text: String)
    data class Command(val command: String, val output: String)

    // ---------- page ----------

    @Composable
    fun Home() {
        AppTheme { Page() }
    }

    @Composable
    fun Page() {
        val colors = MaterialTheme.colorScheme
        val scroll = rememberScrollState()
        val scope = rememberCoroutineScope()
        val uri = LocalUriHandler.current
        val sections = remember { mutableMapOf<String, Float>() }
        val open: (String) -> Unit = { url -> uri.openUri(url) }
        val goTo: (String) -> Unit = { key ->
            val y = sections[key] ?: 0f
            scope.launch { scroll.animateScrollTo((y - 64f * 2).toInt().coerceAtLeast(0)) }
        }
        val mark: (String) -> Modifier = { key ->
            Modifier.onGloballyPositioned { sections[key] = it.positionInRoot().y + scroll.value }
        }

        BoxWithConstraints(Modifier.fillMaxSize().background(colors.background)) {
            val wide = maxWidth > 860.dp
            val cols = if (maxWidth > 860.dp) 4 else if (maxWidth > 560.dp) 2 else 1
            Column(Modifier.fillMaxSize().verticalScroll(scroll)) {
                Spacer(Modifier.height(64.dp))
                Hero(wide, open)
                WhatSection(cols, mark("what"))
                PlaygroundSection(wide, mark("playground"), open)
                ScriptSection(wide, mark("script"), open)
                PluginSection(wide, mark("plugin"), open)
                VsCodeSection(wide, mark("vscode"), open)
                LibrarySection(wide, mark("library"), open)
                CliSection(wide, mark("cli"), open)
                Footer(open)
            }
            NavBar(wide, goTo, open, onTop = { scope.launch { scroll.animateScrollTo(0) } })
        }
    }

    // ---------- building blocks ----------

    @Composable
    fun Container(modifier: Modifier = Modifier, content: @Composable () -> Unit) {
        Box(modifier.fillMaxWidth(), contentAlignment = Alignment.TopCenter) {
            Column(Modifier.widthIn(max = 1120.dp).fillMaxWidth().padding(horizontal = 20.dp)) {
                content()
            }
        }
    }

    @Composable
    fun Section(modifier: Modifier, vertical: Dp = 64.dp, content: @Composable () -> Unit) {
        Column(modifier.fillMaxWidth()) {
            HorizontalDivider(color = MaterialTheme.colorScheme.outline)
            Container(Modifier.padding(vertical = vertical)) { content() }
        }
    }

    @Composable
    fun Split(wide: Boolean, left: @Composable () -> Unit, right: @Composable () -> Unit) {
        if (wide) {
            Row(horizontalArrangement = Arrangement.spacedBy(40.dp), verticalAlignment = Alignment.CenterVertically) {
                Box(Modifier.weight(1f)) { left() }
                Box(Modifier.weight(1f), contentAlignment = Alignment.Center) { right() }
            }
        } else {
            Column(verticalArrangement = Arrangement.spacedBy(32.dp)) {
                left()
                Box(Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) { right() }
            }
        }
    }

    @Composable
    fun Eyebrow(text: String) {
        Text(
            text.uppercase(),
            style = MaterialTheme.typography.labelLarge,
            color = MaterialTheme.colorScheme.primary,
            fontWeight = FontWeight.Bold, letterSpacing = 2.sp
        )
    }

    @Composable
    fun Title(text: String, badge: String = "", badgeColor: Color? = null) {
        val tint = badgeColor ?: MaterialTheme.colorScheme.primary
        FlowRow(
            Modifier.padding(top = 8.dp, bottom = 16.dp),
            horizontalArrangement = Arrangement.spacedBy(14.dp),
            verticalArrangement = Arrangement.spacedBy(10.dp),
            itemVerticalAlignment = Alignment.CenterVertically
        ) {
            Text(
                text,
                style = MaterialTheme.typography.headlineLarge,
                color = MaterialTheme.colorScheme.onBackground,
                fontWeight = FontWeight.Bold
            )
            if (badge.isNotEmpty()) {
                Text(
                    badge,
                    style = MaterialTheme.typography.labelMedium,
                    color = tint, fontWeight = FontWeight.Bold, letterSpacing = 1.sp,
                    modifier = Modifier
                        .clip(RoundedCornerShape(50))
                        .background(tint.copy(alpha = 0.15f))
                        .padding(horizontal = 10.dp, vertical = 3.dp)
                )
            }
        }
    }

    @Composable
    fun Lead(text: String) {
        Text(
            text,
            style = MaterialTheme.typography.titleMedium,
            color = MaterialTheme.colorScheme.onSurfaceVariant,
            fontWeight = FontWeight.Normal, fontSize = 18.sp, lineHeight = 28.sp,
            modifier = Modifier.widthIn(max = 760.dp).padding(bottom = 28.dp)
        )
    }

    @Composable
    fun Check(bold: String, rest: String) {
        val colors = MaterialTheme.colorScheme
        Row(Modifier.padding(vertical = 5.dp), verticalAlignment = Alignment.Top) {
            Box(
                Modifier.padding(top = 5.dp).size(14.dp).clip(RoundedCornerShape(4.dp))
                    .background(brush = Brush.linearGradient(listOf(colors.primary, colors.secondary)))
            )
            Spacer(Modifier.width(12.dp))
            Text(
                buildAnnotatedString {
                    withStyle(SpanStyle(color = colors.onSurface, fontWeight = FontWeight.SemiBold)) { append(bold) }
                    append(" " + rest)
                },
                style = MaterialTheme.typography.bodyLarge,
                color = colors.onSurfaceVariant
            )
        }
    }

    @Composable
    fun PrimaryButton(text: String, onClick: () -> Unit) {
        val colors = MaterialTheme.colorScheme
        val source = remember { MutableInteractionSource() }
        val hovered by source.collectIsHoveredAsState()
        val lift by animateDpAsState(if (hovered) (-2).dp else 0.dp, label = "lift")
        Box(
            Modifier
                .offset(y = lift)
                .clip(RoundedCornerShape(50))
                .background(brush = Brush.horizontalGradient(listOf(colors.primary, colors.secondary)))
                .hoverable(source)
                .pointerHoverIcon(PointerIcon.Hand)
                .clickable(onClick = onClick)
                .padding(horizontal = 22.dp, vertical = 12.dp)
        ) {
            Text(text, style = MaterialTheme.typography.labelLarge, color = colors.onPrimary, fontWeight = FontWeight.Bold)
        }
    }

    @Composable
    fun GhostButton(text: String, onClick: () -> Unit) {
        val colors = MaterialTheme.colorScheme
        val source = remember { MutableInteractionSource() }
        val hovered by source.collectIsHoveredAsState()
        val border by animateColorAsState(if (hovered) colors.onSurfaceVariant else colors.outline, label = "border")
        Box(
            Modifier
                .clip(RoundedCornerShape(50))
                .border(1.dp, border, RoundedCornerShape(50))
                .hoverable(source)
                .pointerHoverIcon(PointerIcon.Hand)
                .clickable(onClick = onClick)
                .padding(horizontal = 20.dp, vertical = 12.dp)
        ) {
            Text(text, style = MaterialTheme.typography.labelLarge, color = colors.onSurface, fontWeight = FontWeight.SemiBold)
        }
    }

    @Composable
    fun Buttons(content: @Composable () -> Unit) {
        FlowRow(
            horizontalArrangement = Arrangement.spacedBy(12.dp),
            verticalArrangement = Arrangement.spacedBy(12.dp)
        ) { content() }
    }

    @Composable
    fun CodeBlock(parts: List<Pair<String, Color>>) {
        val colors = MaterialTheme.colorScheme
        val code = buildAnnotatedString {
            parts.forEach { p -> withStyle(SpanStyle(color = p.second)) { append(p.first) } }
        }
        val hScroll = rememberScrollState()
        Box(
            Modifier
                .fillMaxWidth()
                .clip(RoundedCornerShape(14.dp))
                .background(colors.surfaceContainerLowest)
                .border(1.dp, colors.outline, RoundedCornerShape(14.dp))
                .horizontalScroll(hScroll)
                .padding(18.dp)
        ) {
            SelectionContainer {
                Text(code, fontFamily = FontFamily.Monospace, fontSize = 13.sp, lineHeight = 21.sp, softWrap = false)
            }
        }
    }

    @Composable
    fun DemoCard(label: String, content: @Composable () -> Unit) {
        Column(
            Modifier
                .widthIn(max = 460.dp)
                .fillMaxWidth()
                .shadow(24.dp, RoundedCornerShape(20.dp))
                .clip(RoundedCornerShape(20.dp))
                .background(Color(0xFFF8FAFC))
                .padding(24.dp),
            horizontalAlignment = Alignment.CenterHorizontally
        ) {
            Row(verticalAlignment = Alignment.CenterVertically) {
                Box(Modifier.size(8.dp).clip(CircleShape).background(Color(0xFF22C55E)))
                Spacer(Modifier.width(8.dp))
                Text(label, style = MaterialTheme.typography.labelLarge, color = Color(0xFF64748B))
            }
            Spacer(Modifier.height(16.dp))
            MaterialTheme(colorScheme = lightColorScheme()) { content() }
        }
    }

    @Composable
    fun Screenshot(image: String, caption: String, ratio: Float) {
        val colors = MaterialTheme.colorScheme
        Column(Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {
            AsyncImage(
                model = SITE + image,
                contentDescription = caption,
                contentScale = ContentScale.FillWidth,
                modifier = Modifier
                    .fillMaxWidth()
                    .aspectRatio(ratio)
                    .shadow(24.dp, RoundedCornerShape(16.dp))
                    .clip(RoundedCornerShape(16.dp))
                    .background(colors.surface)
                    .border(1.dp, colors.outline, RoundedCornerShape(16.dp))
            )
            Text(
                caption,
                style = MaterialTheme.typography.bodySmall,
                color = colors.onSurfaceVariant,
                modifier = Modifier.padding(top = 12.dp)
            )
        }
    }

    // ---------- nav ----------

    @Composable
    fun NavLink(text: String, onClick: () -> Unit) {
        val colors = MaterialTheme.colorScheme
        val source = remember { MutableInteractionSource() }
        val hovered by source.collectIsHoveredAsState()
        val color by animateColorAsState(if (hovered) colors.onSurface else colors.onSurfaceVariant, label = "link")
        Text(
            text, style = MaterialTheme.typography.bodyLarge, color = color,
            modifier = Modifier.hoverable(source).pointerHoverIcon(PointerIcon.Hand).clickable(onClick = onClick)
        )
    }

    @Composable
    fun Logo(size: Dp) {
        AsyncImage(
            model = "https://raw.githubusercontent.com/fast-compose/fast-compose/main/docs/images/logo.png",
            contentDescription = "Fast Compose logo",
            modifier = Modifier.size(size)
        )
    }

    @Composable
    fun NavBar(wide: Boolean, goTo: (String) -> Unit, open: (String) -> Unit, onTop: () -> Unit) {
        val colors = MaterialTheme.colorScheme
        Column(Modifier.fillMaxWidth().background(colors.background.copy(alpha = 0.9f))) {
            Container {
                Row(Modifier.height(64.dp), verticalAlignment = Alignment.CenterVertically) {
                    Row(
                        Modifier.pointerHoverIcon(PointerIcon.Hand).clickable(onClick = onTop),
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Logo(32.dp)
                        Spacer(Modifier.width(10.dp))
                        Text("Fast Compose", style = MaterialTheme.typography.titleMedium, color = colors.onSurface, fontWeight = FontWeight.Bold)
                    }
                    Spacer(Modifier.weight(1f))
                    if (wide) {
                        Row(horizontalArrangement = Arrangement.spacedBy(20.dp)) {
                            NavLink("What it is") { goTo("what") }
                            NavLink("Playground") { goTo("playground") }
                            NavLink("Compose Script") { goTo("script") }
                            NavLink("Plugin") { goTo("plugin") }
                            NavLink("VS Code") { goTo("vscode") }
                            NavLink("Library") { goTo("library") }
                            NavLink("CLI") { goTo("cli") }
                            NavLink("GitHub") { open("https://github.com/fast-compose") }
                        }
                    } else {
                        NavLink("GitHub") { open("https://github.com/fast-compose") }
                    }
                }
            }
            HorizontalDivider(color = colors.outline)
        }
    }

    // ---------- hero ----------

    @Composable
    fun Hero(wide: Boolean, open: (String) -> Unit) {
        val colors = MaterialTheme.colorScheme
        Box(
            Modifier.fillMaxWidth().background(
                brush = Brush.radialGradient(
                    listOf(colors.tertiary.copy(alpha = 0.2f), Color.Transparent),
                    radius = 900f
                )
            )
        ) {
            Container(Modifier.padding(top = 56.dp, bottom = 64.dp)) {
                if (wide) {
                    Row(verticalAlignment = Alignment.CenterVertically) {
                        Box(Modifier.weight(1f)) { HeroText(wide, open) }
                        Spacer(Modifier.width(40.dp))
                        Logo(300.dp)
                    }
                } else {
                    HeroText(wide, open)
                }
            }
        }
    }

    @Composable
    fun HeroText(wide: Boolean, open: (String) -> Unit) {
        val colors = MaterialTheme.colorScheme
        val headline = if (wide) MaterialTheme.typography.displayLarge else MaterialTheme.typography.displaySmall
        Column {
            if (!wide) {
                Box(Modifier.fillMaxWidth(), contentAlignment = Alignment.Center) { Logo(160.dp) }
                Spacer(Modifier.height(24.dp))
            }
            Text("Jetpack Compose,", style = headline, color = colors.onBackground, fontWeight = FontWeight.ExtraBold)
            Text("rendered instantly.", style = headline, color = colors.primary, fontWeight = FontWeight.ExtraBold)
            Spacer(Modifier.height(16.dp))
            Text(
                "Fast Compose is an instant runtime for Jetpack Compose code. Write Compose, see it render in " +
                    "milliseconds, on Android, iOS, desktop and the web.",
                style = MaterialTheme.typography.titleLarge,
                color = colors.onSurfaceVariant, fontWeight = FontWeight.Normal, lineHeight = 30.sp,
                modifier = Modifier.widthIn(max = 560.dp)
            )
            Spacer(Modifier.height(28.dp))
            Buttons {
                PrimaryButton("Open the Playground →") { open("playground/") }
                GhostButton("View on GitHub") { open("https://github.com/fast-compose/fast-compose") }
            }
            Spacer(Modifier.height(28.dp))
            PoweredBy(open)
        }
    }

    @Composable
    fun PoweredBy(open: (String) -> Unit) {
        val colors = MaterialTheme.colorScheme
        Row(
            Modifier
                .clip(RoundedCornerShape(12.dp))
                .background(colors.primary.copy(alpha = 0.08f))
                .border(1.dp, colors.primary.copy(alpha = 0.4f), RoundedCornerShape(12.dp))
                .pointerHoverIcon(PointerIcon.Hand)
                .clickable { open("https://github.com/fast-compose/fast-compose.github.io/blob/main/index.html") }
                .padding(horizontal = 14.dp, vertical = 10.dp),
            verticalAlignment = Alignment.CenterVertically
        ) {
            Box(Modifier.size(8.dp).clip(CircleShape).background(colors.primary))
            Spacer(Modifier.width(10.dp))
            Text(
                buildAnnotatedString {
                    append("This whole page is one Compose app, rendered by ")
                    withStyle(SpanStyle(color = colors.primary, fontFamily = FontFamily.Monospace)) { append("compose-script") }
                    append(". View source →")
                },
                style = MaterialTheme.typography.bodyMedium,
                color = colors.onSurfaceVariant
            )
        }
    }

    // ---------- what it is ----------

    @Composable
    fun WhatSection(cols: Int, modifier: Modifier) {
        val steps = listOf(
            Step("Parse", "A pure Kotlin parser reads the source."),
            Step("Interpret", "Runs it inside a real composition."),
            Step("Bind", "Calls the real Compose APIs."),
            Step("Render", "Real Compose draws the pixels.")
        )
        Section(modifier, vertical = 40.dp) {
            Eyebrow("What is Fast Compose")
            Text(
                "Fast Compose reads Compose source code like a browser reads HTML and runs it with the real Compose " +
                    "runtime. No Kotlin compiler, no Gradle, no server.",
                style = MaterialTheme.typography.titleMedium,
                color = MaterialTheme.colorScheme.onBackground,
                fontWeight = FontWeight.Normal, fontSize = 18.sp, lineHeight = 27.sp,
                modifier = Modifier.widthIn(max = 820.dp).padding(top = 8.dp, bottom = 20.dp)
            )
            Column(verticalArrangement = Arrangement.spacedBy(12.dp)) {
                steps.chunked(cols).forEachIndexed { r, row ->
                    // IntrinsicSize.Max gives every card in the row the height of the tallest one
                    Row(
                        Modifier.fillMaxWidth().height(IntrinsicSize.Max),
                        horizontalArrangement = Arrangement.spacedBy(12.dp)
                    ) {
                        row.forEachIndexed { i, step ->
                            StepCard(r * cols + i + 1, step, Modifier.weight(1f).fillMaxHeight())
                        }
                    }
                }
            }
            Spacer(Modifier.height(12.dp))
            FlowLine()
        }
    }

    @Composable
    fun StepCard(number: Int, step: Step, modifier: Modifier) {
        val colors = MaterialTheme.colorScheme
        Row(
            modifier
                .clip(RoundedCornerShape(14.dp))
                .background(colors.surface)
                .border(1.dp, colors.outline, RoundedCornerShape(14.dp))
                .padding(horizontal = 14.dp, vertical = 12.dp),
            verticalAlignment = Alignment.CenterVertically
        ) {
            Box(
                Modifier.size(28.dp).clip(RoundedCornerShape(8.dp))
                    .background(brush = Brush.linearGradient(listOf(colors.primary, colors.tertiary))),
                contentAlignment = Alignment.Center
            ) {
                Text("$number", style = MaterialTheme.typography.labelLarge, color = Color.White, fontWeight = FontWeight.Bold)
            }
            Spacer(Modifier.width(12.dp))
            Column {
                Text(step.title, style = MaterialTheme.typography.titleSmall, color = colors.onSurface, fontWeight = FontWeight.Bold)
                Text(step.text, style = MaterialTheme.typography.bodySmall, color = colors.onSurfaceVariant)
            }
        }
    }

    @Composable
    fun FlowLine() {
        val colors = MaterialTheme.colorScheme
        val strike = SpanStyle(color = colors.error, textDecoration = TextDecoration.LineThrough)
        val bold = SpanStyle(color = colors.onSurface, fontWeight = FontWeight.SemiBold)
        val hScroll = rememberScrollState()
        Box(
            Modifier
                .fillMaxWidth()
                .clip(RoundedCornerShape(14.dp))
                .background(colors.surface)
                .border(1.dp, colors.outline, RoundedCornerShape(14.dp))
                .horizontalScroll(hScroll)
                .padding(horizontal = 20.dp, vertical = 16.dp)
        ) {
            Text(
                buildAnnotatedString {
                    withStyle(bold) { append("Usual: ") }
                    append("edit → ")
                    withStyle(strike) { append("compile") }
                    append(" → ")
                    withStyle(strike) { append("dex") }
                    append(" → ")
                    withStyle(strike) { append("package") }
                    append(" → ")
                    withStyle(strike) { append("install") }
                    append(" → run → 👀      ")
                    withStyle(bold) { append("Fast Compose: ") }
                    append("edit → 👀")
                },
                color = colors.onSurfaceVariant, fontFamily = FontFamily.Monospace, fontSize = 14.sp, softWrap = false
            )
        }
    }

    // ---------- playground ----------

    @Composable
    fun PlaygroundSection(wide: Boolean, modifier: Modifier, open: (String) -> Unit) {
        Section(modifier) {
            Split(
                wide,
                left = {
                    Column {
                        Eyebrow("Playground")
                        Title("Run Jetpack Compose online.", "LIVE")
                        Lead("Write Compose in your browser and see every @Preview update as you type. Also on Android and desktop.")
                        Check("Live previews", "of every @Preview function")
                        Check("Material 3,", "icons, animations, gestures and Canvas drawing")
                        Check("20+ examples:", "lists, dialogs, bottom sheets, pagers, charts and more")
                        Check("Share", "a playground as a link, with 19 editor themes")
                        Spacer(Modifier.height(28.dp))
                        Buttons {
                            PrimaryButton("Open the Playground →") { open("playground/") }
                            GhostButton("Google Play") {
                                open("https://play.google.com/store/apps/details?id=ma7moud3ly.fast.compose.playground")
                            }
                            GhostButton("Desktop") { open("https://github.com/fast-compose/playground/releases/latest") }
                        }
                    }
                },

    @Composable
    fun LikeCard() {
        var liked by remember { mutableStateOf(false) }
        var count by remember { mutableStateOf(41) }
        val tint by animateColorAsState(if (liked) Color(0xFFEF4444) else Color.Gray, label = "tint")
        val scale by animateFloatAsState(if (liked) 1.25f else 1f, label = "scale")
        Card(Modifier.fillMaxWidth()) {
            Row(Modifier.padding(16.dp), verticalAlignment = Alignment.CenterVertically) {
                Box(
                    Modifier.size(48.dp).clip(CircleShape)
                        .background(brush = Brush.linearGradient(listOf(Color(0xFF3DDC84), Color(0xFF5B4BD6)))),
                    contentAlignment = Alignment.Center
                ) {
                    Text("FC", color = Color.White, fontWeight = FontWeight.Bold)
                }
                Spacer(Modifier.width(12.dp))
                Column(Modifier.weight(1f)) {
                    Text("Fast Compose", fontWeight = FontWeight.Bold)
                    Text("$count likes", style = MaterialTheme.typography.bodySmall)
                }
                IconButton(onClick = {
                    liked = !liked
                    count += if (liked) 1 else -1
                }) {
                    Icon(
                        if (liked) Icons.Default.Favorite else Icons.Default.FavoriteBorder,
                        contentDescription = "Like", tint = tint, modifier = Modifier.scale(scale)
                    )
                }
            }
        }
    }

    @Composable
    fun Terminal(commands: List<Command>) {
        val colors = MaterialTheme.colorScheme
        val blink by rememberInfiniteTransition(label = "cursor").animateFloat(
            initialValue = 0f, targetValue = 1f,
            animationSpec = infiniteRepeatable(tween(600), repeatMode = RepeatMode.Reverse),
            label = "blink"
        )
        Column(
            Modifier
                .widthIn(max = 520.dp)
                .fillMaxWidth()
                .clip(RoundedCornerShape(16.dp))
                .background(colors.surfaceContainerLowest)
                .border(1.dp, colors.outline, RoundedCornerShape(16.dp))
        ) {
            Row(
                Modifier.fillMaxWidth().background(colors.surface).padding(12.dp),
                horizontalArrangement = Arrangement.spacedBy(8.dp)
            ) {
                Box(Modifier.size(12.dp).clip(CircleShape).background(Color(0xFFFF5F57)))
                Box(Modifier.size(12.dp).clip(CircleShape).background(Color(0xFFFEBC2E)))
                Box(Modifier.size(12.dp).clip(CircleShape).background(Color(0xFF28C840)))
            }
            Column(Modifier.padding(18.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                commands.forEach { c ->
                    Column {
                        Text(
                            buildAnnotatedString {
                                withStyle(SpanStyle(color = colors.primary)) { append("$ ") }
                                append(c.command)
                            },
                            color = colors.onSurface, fontFamily = FontFamily.Monospace, fontSize = 14.sp
                        )
                        Text("  " + c.output, color = Comment, fontFamily = FontFamily.Monospace, fontSize = 13.sp)
                    }
                }
                Row(verticalAlignment = Alignment.CenterVertically) {
                    Text("$ ", color = colors.primary, fontFamily = FontFamily.Monospace, fontSize = 14.sp)
                    Box(Modifier.size(width = 9.dp, height = 18.dp).alpha(blink).background(colors.onSurface))
                }
            }
        }
    }
